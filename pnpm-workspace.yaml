# pnpm blocks dependency postinstall scripts by default (supply-chain attack defense).
# Leaving them blocked causes install to fail with ERR_PNPM_IGNORED_BUILDS (exit 1) and stops the build.
# Allow build scripts here only for packages that actually need them.
#
#   esbuild — links platform-specific native binaries. Used by Vite.
#
# ⚠️ As of pnpm 11, pnpm-workspace.yaml is the source of truth for this setting.
#    The "pnpm" field and onlyBuiltDependencies in package.json are no longer read.
#
# If adding a new dependency triggers the same error, add true only after verifying
# that the package genuinely needs to run scripts. If unsure, leave false and test the build.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
