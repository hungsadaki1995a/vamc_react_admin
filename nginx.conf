server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Security headers (applied to all responses, incl. the SPA fallback below).
    # style-src needs 'unsafe-inline': AntD 6 / AG Grid inject inline <style> at runtime.
    # script-src omits 'unsafe-inline'/'unsafe-eval': all app JS ships as same-origin
    # /assets/*.js bundles; no inline <script> or eval is used by the build.
    #
    # 🔴 add_header 는 상속되지 않는다 — 정확히는, 하위 location 에 add_header 가 하나라도
    #    있으면 상위 레벨의 add_header 가 **전부 사라진다**(nginx 문서: "inherited from the
    #    previous configuration level if and only if there are no add_header directives
    #    defined on the current level"). 그래서 아래 두 location 은 캐시 헤더만이 아니라
    #    이 보안 헤더 4줄을 **다시 적어야 한다.** 빼먹으면 CSP 가 조용히 사라지는데,
    #    화면은 멀쩡히 뜨기 때문에 알아채기 어렵다.
    #    새 location 에 add_header 를 추가할 때는 이 블록을 함께 복사할 것.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

    # /api → backend 컨테이너 (same-origin이라 CORS 불필요, Refresh-Token 등 헤더 그대로 전달)
    # 변수 + resolver: backend 컨테이너 재생성 시 stale IP 방지 (Docker 내장 DNS 재해석)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:30183;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 캐시 정책 — 배포해도 사용자가 새 번들을 못 받는 사고를 막는다.
    #
    # 종전에는 캐시 지시어가 하나도 없었다. Cache-Control 이 없으면 브라우저가
    # **휴리스틱 캐싱**으로 index.html 을 재검증 없이 재사용할 수 있고, 그러면
    # 새 배포가 나가도 옛 번들이 계속 실행된다.
    # 실제로 2026-08-26 X-Menu-Cd 헤더 배포 때 이 문제로, 서버는 새 번들을 서빙하는데
    # 브라우저는 옛 번들을 돌려 기능이 동작하지 않았다(하드 리로드 후 정상).
    #
    # 해법은 두 파일의 성격이 정반대라는 점을 이용한다:
    #   · index.html   파일명이 고정이고 내용이 매 배포마다 바뀐다 → 캐시 금지, 항상 재검증
    #   · assets/*     파일명에 콘텐츠 해시가 박힌다(index-BCS2dodE.js) → 내용이 바뀌면
    #                  파일명도 바뀌므로 영구 캐시가 안전하다
    # ─────────────────────────────────────────────────────────────────────────

    # index.html — 매 요청 재검증. ETag 로 변경 없으면 304 라 비용은 거의 없다.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        # ↓ 상위 server 블록의 보안 헤더 재선언 (위 🔴 주석 참조)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }

    # 해시 파일명 정적 자산 — 1년 영구 캐시.
    # immutable 은 "재검증조차 하지 마라"는 뜻이라 새로고침 시 304 왕복도 사라진다.
    # 해시가 바뀌면 URL 자체가 달라지므로 낡은 파일이 잡힐 일이 없다.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # ↓ 상위 server 블록의 보안 헤더 재선언 (위 🔴 주석 참조)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }

    # SPA 히스토리 폴백 (/app/:tabKey 라우팅)
    # try_files 가 /index.html 로 내부 리다이렉트하면 위 `location = /index.html` 이
    # 적용되므로, 딥링크로 들어와도 HTML 은 캐시되지 않는다.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
