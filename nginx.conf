server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Security headers (applied to all responses, incl. the SPA fallback below).
    # style-src needs 'unsafe-inline': AntD 6 / AG Grid inject inline <style> at runtime.
    # script-src omits 'unsafe-inline'/'unsafe-eval': all app JS ships as same-origin
    # /assets/*.js bundles; no inline <script> or eval is used by the build.
    #
    # 🔴 add_header is NOT inherited — specifically, if a child location has even one add_header,
    #    all parent-level add_header directives disappear (nginx docs: "inherited from the
    #    previous configuration level if and only if there are no add_header directives
    #    defined on the current level"). Therefore, the two locations below must re-declare
    #    not only cache headers but also these 4 security header lines. Otherwise CSP silently vanishes,
    #    which is hard to notice because the page still renders normally.
    #    Always copy this block when adding add_header to a new location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

    # /api → backend container (same-origin so CORS is unnecessary; pass Refresh-Token etc. headers as-is)
    # Variable + resolver: prevents stale IP when backend container is recreated (re-resolves via Docker embedded DNS)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:30183;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Cache policy — prevents users from failing to receive new bundles after deployment.
    #
    # Previously there were no cache directives at all. Without Cache-Control, browsers can
    # **heuristically cache** and reuse index.html without revalidation, causing
    # old bundles to keep running even after a new deployment.
    # In fact, during the 2026-08-26 X-Menu-Cd header deployment, the server served the new bundle
    # while browsers ran the old bundle and the feature broke (worked after hard reload).
    #
    # The solution leverages the opposite nature of the two file types:
    #   · index.html   fixed filename, content changes every deploy → no-cache, always revalidate
    #   · assets/*     content hash embedded in filename (index-BCS2dodE.js) → when content changes,
    #                  the filename changes too, so immutable long-term caching is safe
    # ─────────────────────────────────────────────────────────────────────────

    # index.html — revalidate every request. With ETag, unchanged responses return 304 at minimal cost.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        # ↓ Re-declare security headers from parent server block (see 🔴 comment above)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }

    # Content-hashed static assets — 1-year immutable cache.
    # immutable means "do not even revalidate", eliminating 304 round-trips on refresh.
    # When the hash changes, the URL itself changes, so stale files will never be served.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # ↓ Re-declare security headers from parent server block (see 🔴 comment above)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }

    # SPA history fallback (/app/:tabKey routing)
    # When try_files internally redirects to /index.html, `location = /index.html` above applies,
    # so HTML is never cached even when entering via a deep link.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
